<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="title">
  <title id="title">Лист с командой терминала опускается в папку проекта</title>
  <style>
    .paper { transform-origin: 223px 165px; }
    @media (prefers-reduced-motion: no-preference) {
      .paper { animation: file-away 2.7s cubic-bezier(.22,.68,.28,1) both; }
      @keyframes file-away {
        0%, 9% { transform: translate(8px,-25px) rotate(3deg); }
        76% { transform: translate(0,1.2px) rotate(-.35deg); }
        100% { transform: none; }
      }
    }
  </style>
  <g stroke="#242220" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <!-- The back cover and its folded tab. -->
    <path fill="#fff" d="M121 236 148 111q.5-2.6 3.6-1.8l18.7 5.4 5.6-8.6q1.2-1.8 3.8-.9l29 8.4q2.3.7 2.4 3l.4 7.3 102 29.8q2.3.6 1.6 3.2L284 261.3l-18.3 13.1Z"/>
    <path stroke-width=".65" d="m152.3 112.4 19.9 5.9 6.1-9.6 29.2 8.4m4.9 10.2 99.6 29.1M284.2 256.9l27.1-94.3"/>
    <!-- A second page stays in place behind the terminal sheet. -->
    <path fill="#fff" d="m130.3 229.7 23-100.8 113.5 33.2-22 101.9z"/>
    <path stroke-width=".65" d="m157.1 132.9 105.9 30.6"/>
    <g class="paper">
      <path fill="#fff" d="m147.2 218.5 26-159.9 103.4 30.1 10.1 15-23.5 148.7Z"/>
      <path stroke-width=".82" d="m276.6 88.7-1.9 11.1 12 3.9m-116-29.6 113.6 32.8"/>
      <g fill="#242220" stroke="none">
        <circle cx="177.6" cy="68.2" r="1.05"/><circle cx="182" cy="69.5" r="1.05"/><circle cx="186.4" cy="70.7" r="1.05"/>
      </g>
      <path stroke-width="1.55" d="m177.9 88.4 4.7 5.1-6 2.4m9.9 3.2 7.2 2.1"/>
      <path stroke-width=".95" d="m174.8 111.3 43.7 12.5m4.8 1.4 17.9 5.3m-67.9-11.9 28.3 8.1m-29.5-1 46.4 13.5"/>
    </g>
    <!-- A shallow accordion fold gives the opening depth on the right. -->
    <path fill="#fff" d="M242 180.2 253.1 177l5.4-4.4 6.1.2 20.2-11.2 5.2-.5 20.1-7.9-26 108.2-18.4 13Z"/>
    <path stroke-width=".9" d="m258.5 172.6 8.7 93.1m17.6-104.1-13.9 104m19.1-104.5-15 100"/>
