    <path stroke-width=".74" d="m98.1 135.2 54.5 15.7m10.7 9.8 76.4 22.1M121.7 229.7l139.8 40.6"/>
    <!-- Small paper label on the cover, laid parallel to its edges. -->
    <path stroke-width=".92" d="m111.3 155.2 31.1 8.9 2.2 8.8-31-9z"/>
    <path stroke-width=".64" d="m116.2 160.6 13 3.7m2.8.9 4.6 1.3"/>
    <g stroke-width=".65">
      <path d="m266.7 270.3 3.5-3m-1 4.2 4.2-3.6m-.4 3 4.1-3.5m-.2 1.6 5-4.4"/>
